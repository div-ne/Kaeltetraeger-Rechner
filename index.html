<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCon Web</title>
  <style>
    :root{--bg:#f6f7fb;--card:#ffffff;--text:#1c2333;--muted:#667085;--border:#d9dfeb;--primary:#165dff;--primary2:#0f4fd6;--ok:#0f9d58;--shadow:0 12px 32px rgba(23,34,77,.08)}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1200px;margin:0 auto;padding:24px} h1{margin:0 0 8px;font-size:32px}.sub{color:var(--muted);margin-bottom:20px}
    .grid{display:grid;grid-template-columns:420px 1fr;gap:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:18px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1} label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
    input,select,button{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);font:inherit} button{background:var(--primary);color:#fff;border:none;font-weight:700;cursor:pointer}.secondary{background:#eef3ff;color:var(--primary)} button:hover{background:var(--primary2)} .secondary:hover{background:#dde8ff}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.status{margin-top:10px;font-size:14px;color:var(--muted);min-height:20px}
    table{width:100%;border-collapse:collapse;font-size:14px}.table-wrap{overflow:auto} th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left} th:nth-child(2),th:nth-child(3),td:nth-child(2),td:nth-child(3){text-align:right}
    .note{font-size:13px;color:var(--muted);margin-top:10px}.debug{margin-top:12px;padding:10px 12px;background:#f8fafc;border:1px dashed var(--border);border-radius:12px;font-size:12px;color:#475467;white-space:pre-wrap}
    @media (max-width: 920px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CCon Web</h1>
    <div class="sub">Reparierte GitHub-Pages-Version mit offiziellem CoolProp-Lademuster.</div>
    <div class="grid">
      <section class="card">
        <div class="form-grid">
          <div class="full"><label>Projekt</label><input id="project" value="Projekt"></div>
          <div><label>Rohrinnendurchmesser [mm]</label><input id="di" type="number" step="any" value="25"></div>
          <div><label>Rohrrauheit [mm]</label><input id="rough" type="number" step="any" value="0.0015"></div>
          <div><label>Fluid 1</label><select id="c1"><option>Wasser</option><option>Antifrogen N</option><option>Antifrogen L</option><option>Kaliumformiat</option></select></div>
          <div><label>Konzentration 1 [%]</label><input id="c1pct" type="number" step="any" value="100"></div>
          <div><label>Basis</label><select id="vq"><option>Volumenstrom Fluid 1 [m3/h]:</option><option>Übertragene Leistung Fluid 1 [kW]:</option></select></div>
          <div><label>Wert</label><input id="vqval" type="number" step="any" value="10"></div>
          <div><label>Druckverlust Fluid 1 [bar]</label><input id="dp" type="number" step="any" value="2.5"></div>
          <div><label>Mittlere Temperatur [°C]</label><input id="T" type="number" step="any" value="7.5"></div>
          <div><label>Temperaturdifferenz [K]</label><input id="dT" type="number" step="any" value="5"></div>
          <div><label>Fluid 2</label><select id="c2"><option>Wasser</option><option selected>Antifrogen N</option><option>Antifrogen L</option><option>Kaliumformiat</option></select></div>
          <div><label>Konzentration 2 [%]</label><input id="c2pct" type="number" step="any" value="34"></div>
        </div>
        <div class="actions">
          <button id="calcBtn">Berechnen</button>
          <button class="secondary" id="csvBtn">CSV herunterladen</button>
        </div>
        <div class="status" id="status">CoolProp lädt …</div>
        <div class="note">Wenn hier länger nichts passiert, wurden coolprop.js oder coolprop.wasm nicht korrekt hochgeladen.</div>
        <div class="debug" id="debug">Warte auf Initialisierung …</div>
      </section>
      <section class="card">
        <div class="table-wrap"><table><thead><tr><th>Parameter</th><th>Kälteträger 1</th><th>Kälteträger 2</th></tr></thead><tbody id="resultsBody"></tbody></table></div>
      </section>
    </div>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const debugEl = document.getElementById('debug');
    const resultsBody = document.getElementById('resultsBody');
    let ModuleReady = false;
    let currentRows = [];
    function setStatus(msg, ok=false){ statusEl.textContent = msg; statusEl.style.color = ok ? '#0f9d58' : '#667085'; }
    function dbg(msg){ debugEl.textContent += '
' + msg; }
    function round2(x){ return Number.isFinite(x) ? Math.round(x*100)/100 : ''; }
    function fluidString(name, pct){ if(name==='Wasser') return 'INCOMP::Water'; if(name==='Antifrogen N') return `INCOMP::AN[${pct/100}]`; if(name==='Antifrogen L') return `INCOMP::AL[${pct/100}]`; if(name==='Kaliumformiat') return `INCOMP::AKF[${pct/100}]`; throw new Error('Unbekanntes Fluid: ' + name); }
    function displayName(name, pct){ return name === 'Wasser' ? 'Wasser' : `${name} ${pct} %`; }
    function propsSI(out, n1, v1, n2, v2, fluid){ return Module.PropsSI(out, n1, v1, n2, v2, fluid); }
    function frictionCoefficient(di,w,nu,k){ let lambda_result=0.02; const Re=di*w/nu; k=k/1e3; const epsilon_k=k/di; const lambda_hagenpoiseulle=64/Re; const lambda_blasius=0.3164/Math.pow(Re,0.25); const lambda_nikuradse=Math.pow(-2*Math.log10(k/3.71/di),-2); let lambda_prandtl=0.02; for(let i=0;i<10;i++) lambda_prandtl=Math.pow(2*Math.log10(Re*Math.sqrt(lambda_prandtl)),-2); let lambda_colebrookwhite=0.02; for(let i=0;i<10;i++) lambda_colebrookwhite=Math.pow(-2*Math.log10(2.51/Re/lambda_colebrookwhite+k/3.71/di),-2); const check_moody_diagram=Re*Math.sqrt(lambda_nikuradse)*k/di; if (Re<2320) lambda_result=lambda_hagenpoiseulle; else { if (check_moody_diagram>=200) lambda_result=lambda_nikuradse; else if (epsilon_k<0.001 && Re<10000) lambda_result=lambda_blasius; else if (epsilon_k<0.0002 && Re<100000) lambda_result=lambda_blasius; else if (epsilon_k<0.00002 && Re<1000000) lambda_result=lambda_prandtl; else if (epsilon_k<0.00001) lambda_result=lambda_prandtl; lambda_result=lambda_colebrookwhite; } return lambda_result; }
    function freezePoint(fluidName, fluidStringValue, atm){ if(fluidName==='Wasser') return 273.15; try { return propsSI('T_freeze','T',0,'P',atm,fluidStringValue); } catch(e){ return NaN; } }
    function renderRows(rows){ currentRows=rows; resultsBody.innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join(''); }
    function runCalculation(){
      if(!ModuleReady) return setStatus('CoolProp ist noch nicht fertig geladen.');
      try {
        const project = document.getElementById('project').value || 'Projekt';
        const coolant_1 = document.getElementById('c1').value; const coolant_2 = document.getElementById('c2').value;
        let concentration_1 = parseFloat(document.getElementById('c1pct').value); let concentration_2 = parseFloat(document.getElementById('c2pct').value);
        const V_or_Q = document.getElementById('vq').value; let volume_flow_coolant_1 = parseFloat(document.getElementById('vqval').value); let heat_capacity = parseFloat(document.getElementById('vqval').value);
        let pressure_drop_coolant_1 = parseFloat(document.getElementById('dp').value); const roughness = parseFloat(document.getElementById('rough').value); let mean_temperature = parseFloat(document.getElementById('T').value); const temperature_difference = parseFloat(document.getElementById('dT').value); let mean_inner_pipe_diameter = parseFloat(document.getElementById('di').value);
        const atmospheric_pressure = 1.01325e5; const fluid_1 = fluidString(coolant_1, concentration_1); const fluid_2 = fluidString(coolant_2, concentration_2); const name_1 = displayName(coolant_1, concentration_1); const name_2 = displayName(coolant_2, concentration_2);
        mean_temperature += 273.15; volume_flow_coolant_1 = volume_flow_coolant_1 / 3.6 * 1e-3; heat_capacity = heat_capacity * 1e3; mean_inner_pipe_diameter *= 1e-3; pressure_drop_coolant_1 *= 1e5;
        const density_coolant_1 = propsSI('D','T',mean_temperature,'P',atmospheric_pressure,fluid_1); const spec_heat_coolant_1 = propsSI('C','T',mean_temperature,'P',atmospheric_pressure,fluid_1); const dynamic_viscosity_coolant_1 = propsSI('V','T',mean_temperature,'P',atmospheric_pressure,fluid_1); const kinematic_viscosity_coolant_1 = dynamic_viscosity_coolant_1 / density_coolant_1; const T_freeze_coolant_1 = freezePoint(coolant_1, fluid_1, atmospheric_pressure);
        const density_coolant_2 = propsSI('D','T',mean_temperature,'P',atmospheric_pressure,fluid_2); const spec_heat_coolant_2 = propsSI('C','T',mean_temperature,'P',atmospheric_pressure,fluid_2); const dynamic_viscosity_coolant_2 = propsSI('V','T',mean_temperature,'P',atmospheric_pressure,fluid_2); const kinematic_viscosity_coolant_2 = dynamic_viscosity_coolant_2 / density_coolant_2; const T_freeze_coolant_2 = freezePoint(coolant_2, fluid_2, atmospheric_pressure);
        if (V_or_Q.includes('Volumenstrom')) heat_capacity = volume_flow_coolant_1 * density_coolant_1 * spec_heat_coolant_1 * temperature_difference; else if (V_or_Q.includes('Leistung')) volume_flow_coolant_1 = heat_capacity / (density_coolant_1 * spec_heat_coolant_1 * temperature_difference);
        const volume_flow_coolant_2 = heat_capacity / (density_coolant_2 * spec_heat_coolant_2 * temperature_difference); const velocity_coolant_1 = 4 * volume_flow_coolant_1 / Math.PI / Math.pow(mean_inner_pipe_diameter,2); const velocity_coolant_2 = 4 * volume_flow_coolant_2 / Math.PI / Math.pow(mean_inner_pipe_diameter,2);
        const lambda1 = frictionCoefficient(mean_inner_pipe_diameter, velocity_coolant_1, kinematic_viscosity_coolant_1, roughness); const lambda2 = frictionCoefficient(mean_inner_pipe_diameter, velocity_coolant_2, kinematic_viscosity_coolant_2, roughness);
        const pressure_drop_coolant_2 = pressure_drop_coolant_1 * lambda2 / lambda1 * density_coolant_1 / density_coolant_2 * Math.pow(spec_heat_coolant_1,2) / Math.pow(spec_heat_coolant_2,2);
        const rows = [['Bezeichnung', project + ' / ' + name_1, project + ' / ' + name_2], ['Übertragene Leistung [kW]', round2(heat_capacity/1000), round2(heat_capacity/1000)], ['Volumenstrom [m3/h]', round2(volume_flow_coolant_1 * 3.6 / 1e-3), round2(volume_flow_coolant_2 * 3.6 / 1e-3)], ['Strömungsgeschwindigkeit [m/s]', round2(velocity_coolant_1), round2(velocity_coolant_2)], ['Druckverlust [bar]', round2(pressure_drop_coolant_1/1e5), round2(pressure_drop_coolant_2/1e5)], ['Dichte [kg/m3]', round2(density_coolant_1), round2(density_coolant_2)], ['Spezifische Wärmekapazität [kJ/kg/K]', round2(spec_heat_coolant_1/1000), round2(spec_heat_coolant_2/1000)], ['Mittlere Temperatur [°C]', round2(mean_temperature-273.15), round2(mean_temperature-273.15)], ['Gefrierpunkt [°C]', round2(T_freeze_coolant_1-273.15), round2(T_freeze_coolant_2-273.15)]];
        renderRows(rows); setStatus('Berechnung erfolgreich.', true);
      } catch (err) { console.error(err); dbg('Fehler: ' + err.message); setStatus('Fehler bei der Berechnung: ' + err.message); }
    }
    function downloadCSV(){ if(!currentRows.length) return setStatus('Erst berechnen, dann CSV herunterladen.'); const csv=['Parameter;Kälteträger 1;Kälteträger 2', ...currentRows.map(r=>r.join(';'))].join('
'); const blob=new Blob([csv], {type:'text/csv;charset=utf-8;'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ccon-ergebnis.csv'; a.click(); URL.revokeObjectURL(a.href); }
    document.getElementById('calcBtn').addEventListener('click', runCalculation); document.getElementById('csvBtn').addEventListener('click', downloadCSV);
    document.getElementById('c1').addEventListener('change', e => { const el=document.getElementById('c1pct'); if(e.target.value==='Wasser'){ el.value=100; el.readOnly=true; } else { el.readOnly=false; }});
    document.getElementById('c2').addEventListener('change', e => { const el=document.getElementById('c2pct'); if(e.target.value==='Wasser'){ el.value=100; el.readOnly=true; } else { el.readOnly=false; }});
    window.onerror = function(message, source, lineno, colno){ dbg('window.onerror: ' + message + ' @ ' + source + ':' + lineno + ':' + colno); };
    var Module = {
      locateFile: function(path){ dbg('locateFile(' + path + ')'); return './assets/' + path; },
      onRuntimeInitialized: function(){ dbg('onRuntimeInitialized erreicht'); ModuleReady = true; setStatus('CoolProp geladen. Du kannst jetzt rechnen.', true); },
      print: function(text){ dbg('print: ' + text); },
      printErr: function(text){ dbg('printErr: ' + text); }
    };
    dbg('Module vorbereitet');
  </script>
  <script src="./assets/coolprop.js"></script>
</body>
</html>
